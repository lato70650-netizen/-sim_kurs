<svg xmlns="http://www.w3.org/2000/svg" font-family="Manrope, Arial, sans-serif" viewBox="0 0 400 410" role="img" aria-labelledby="route-map-title route-map-description">
    <title id="route-map-title">Два пути до секции</title>
    <desc id="route-map-description">Слева путь 1 от дома до секции идёт по велодорожке, обозначенной синим знаком с велосипедом, затем по тротуару. Справа путь 2 идёт вдоль дороги по обочине. У въезда в соседний проезд стоит красный знак с белым прямоугольником.</desc>
    <defs>
      <pattern id="route-grid" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M20 0H0V20" fill="none" stroke="#28465a" opacity=".38"/>
      </pattern>
    </defs>
    <rect width="400" height="410" fill="#102638"/>
    <rect width="400" height="410" fill="url(#route-grid)"/>
